<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#484f58" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    
    <!-- Subtle drop shadow -->
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#010409" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="15" y="15" width="870" height="540" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- ==================== LAYER 1: CLIENTS ==================== -->
  <text x="40" y="42" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="1">CLIENTS &amp; INGRESS</text>

  <!-- Clients Container -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="52" width="820" height="66" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="40" y="52" width="4" height="66" rx="2" fill="#58a6ff" />

    <!-- Pill 1: Discord Bot -->
    <rect x="58" y="67" width="148" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="132" y="89" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">Discord Bot</text>
    <text x="132" y="100" fill="#8b949e" font-size="9" text-anchor="middle">@SigmaAgent / Chat</text>

    <!-- Pill 2: GitHub Webhooks -->
    <rect x="220" y="67" width="168" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="304" y="89" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">GitHub Webhooks</text>
    <text x="304" y="100" fill="#8b949e" font-size="9" text-anchor="middle">Push / Issues / PRs</text>

    <!-- Pill 3: REST API -->
    <rect x="402" y="67" width="158" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="481" y="89" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">FastAPI REST</text>
    <text x="481" y="100" fill="#8b949e" font-size="9" text-anchor="middle">:8000 /investigate</text>

    <!-- Pill 4: Web Dashboard -->
    <rect x="574" y="67" width="146" height="36" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="647" y="89" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">Next.js Web</text>
    <text x="647" y="100" fill="#8b949e" font-size="9" text-anchor="middle">:3000 OAuth / Setup</text>

    <text x="840" y="90" fill="#8b949e" font-size="11" text-anchor="end">unified event path</text>
  </g>

  <!-- Flow 1: Clients -> Router -->
  <line x1="450" y1="118" x2="450" y2="148" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== LAYER 2: ROUTER ==================== -->
  <text x="40" y="146" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="1">ROUTE / ZERO TOKENS FIRST</text>

  <!-- Router Container -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="154" width="820" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="40" y="154" width="4" height="72" rx="2" fill="#d29922" />

    <text x="60" y="181" fill="#f0f6fc" font-size="14" font-weight="600">Deterministic Intent Router</text>
    <text x="60" y="202" fill="#8b949e" font-size="12">Regex parsing &amp; offline analyzers resolve tasks, dependencies, contributors, issues, impact &amp; bottlenecks</text>

    <!-- Zero tokens badge -->
    <rect x="735" y="174" width="105" height="26" rx="13" fill="#1f6feb22" stroke="#388bfd" stroke-width="1" />
    <text x="787" y="191" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">⚡ Zero Tokens</text>
  </g>

  <!-- Flow 2: Router -> Decide (Fork) -->
  <!-- Left path: match -->
  <line x1="250" y1="226" x2="250" y2="280" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="205" y="243" width="90" height="18" rx="4" fill="#0d1117" />
  <text x="250" y="256" fill="#3fb950" font-size="11" font-weight="600" text-anchor="middle">match</text>

  <!-- Right path: no match / reasoning -->
  <line x1="650" y1="226" x2="650" y2="280" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="585" y="243" width="130" height="18" rx="4" fill="#0d1117" />
  <text x="650" y="256" fill="#d29922" font-size="11" font-weight="600" text-anchor="middle">unresolved / complex</text>

  <!-- ==================== LAYER 3: DECIDE ==================== -->
  <text x="40" y="278" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="1">DECIDE &amp; REASON</text>

  <!-- Left Decision: FalkorDB Graph Engine -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="286" width="395" height="88" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="40" y="286" width="4" height="88" rx="2" fill="#3fb950" />

    <text x="58" y="312" fill="#f0f6fc" font-size="13" font-weight="600">Graph Engine (Direct Query)</text>
    <text x="58" y="331" fill="#8b949e" font-size="11">FalkorDB Cypher, PageRank &amp; WCC workstreams</text>
    
    <!-- Badges -->
    <rect x="58" y="342" width="76" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="96" y="356" fill="#8b949e" font-size="10" text-anchor="middle">PageRank</text>

    <rect x="140" y="342" width="98" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="189" y="356" fill="#8b949e" font-size="10" text-anchor="middle">BLOCKED_BY*</text>

    <rect x="244" y="342" width="76" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="282" y="356" fill="#8b949e" font-size="10" text-anchor="middle">Critical Path</text>
  </g>

  <!-- Right Decision: Gemini AI LLM Failover -->
  <g filter="url(#card-shadow)">
    <rect x="465" y="286" width="395" height="88" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="465" y="286" width="4" height="88" rx="2" fill="#bc8cff" />

    <text x="483" y="312" fill="#f0f6fc" font-size="13" font-weight="600">LLM Failover &amp; Synthesis</text>
    <text x="483" y="331" fill="#8b949e" font-size="11">Gemini AI multi-turn reasoning + cited sources</text>

    <!-- Badges -->
    <rect x="483" y="342" width="112" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="539" y="356" fill="#bc8cff" font-size="10" text-anchor="middle">Gemini 2.5 Flash</text>

    <rect x="601" y="342" width="102" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="652" y="356" fill="#8b949e" font-size="10" text-anchor="middle">Evidence Linking</text>

    <rect x="709" y="342" width="88" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="753" y="356" fill="#8b949e" font-size="10" text-anchor="middle">Audit Trail</text>
  </g>

  <!-- Flow 3: Decisions -> Knowledge Brain (Converge) -->
  <path d="M 237 374 L 237 398 L 450 398 L 450 412" fill="none" stroke="#484f58" stroke-width="1.5" />
  <path d="M 662 374 L 662 398 L 450 398 L 450 412" fill="none" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== LAYER 4: STORAGE ==================== -->
  <text x="40" y="410" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="1">MULTI-TENANT COMPANY BRAIN</text>

  <!-- Storage Container -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="418" width="820" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="40" y="418" width="4" height="74" rx="2" fill="#58a6ff" />

    <text x="58" y="442" fill="#f0f6fc" font-size="13" font-weight="600">FalkorDB Per-Server Graph Store</text>
    <text x="58" y="459" fill="#8b949e" font-size="11">Isolated prefix graph per Discord guild (<tspan fill="#58a6ff" font-family="'SFMono-Regular', Consolas, monospace">Sigma_&lt;guild_id&gt;</tspan>) preserving data privacy</text>

    <!-- Schema Entities Pills -->
    <rect x="58" y="468" width="102" height="18" rx="4" fill="#21262d" />
    <text x="109" y="481" fill="#7ee787" font-size="9" font-weight="600" text-anchor="middle">:Task  :Developer</text>

    <rect x="166" y="468" width="118" height="18" rx="4" fill="#21262d" />
    <text x="225" y="481" fill="#79c0ff" font-size="9" font-weight="600" text-anchor="middle">:Commit  :File  :Issue</text>

    <rect x="290" y="468" width="140" height="18" rx="4" fill="#21262d" />
    <text x="360" y="481" fill="#d2a8ff" font-size="9" font-weight="600" text-anchor="middle">:Document  :DocSection</text>

    <rect x="436" y="468" width="144" height="18" rx="4" fill="#21262d" />
    <text x="508" y="481" fill="#ffa657" font-size="9" font-weight="600" text-anchor="middle">:DiscordMessage  :Evidence</text>

    <text x="840" y="456" fill="#8b949e" font-size="11" text-anchor="end">ACID Graph + Full-Text</text>
  </g>

  <!-- ==================== LAYER 5: BOTTOM CAPABILITIES BAR ==================== -->
  <g>
    <rect x="40" y="508" width="820" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="450" y="528" fill="#8b949e" font-size="11" font-weight="500" text-anchor="middle">
      <tspan fill="#58a6ff">●</tspan> Continuous Webhook Ingestion &nbsp;&nbsp;&nbsp;
      <tspan fill="#3fb950">●</tspan> Automatic Garbage Collection &nbsp;&nbsp;&nbsp;
      <tspan fill="#d29922">●</tspan> Evidence Provenance &nbsp;&nbsp;&nbsp;
      <tspan fill="#bc8cff">●</tspan> 6-Way Expertise Ranking
    </text>
  </g>
</svg>

